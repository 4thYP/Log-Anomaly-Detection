name: API CI

on:
  push:
    paths:
      - "backend/log-ingestion-api/**"
  pull_request:
    paths:
      - "backend/log-ingestion-api/**"

jobs:
  test-api:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --- PYTHON DEPENDENCY CACHE ---
      - name: Set pip cache directory (cross-platform)
        id: pip-cache
        run: |
          echo "PIP_CACHE_DIR=$(python3 -c 'import pip, os; print(os.path.join(os.path.expanduser(\"~\"), \".cache\", \"pip\"))')" >> $GITHUB_ENV

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/log-ingestion-api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # --- INSTALL DEPS ---
      - name: Install dependencies
        working-directory: ./backend/log-ingestion-api/
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # --- LINT / SYNTAX CHECK ---
      - name: Lint & Syntax Check
        working-directory: ./backend/log-ingestion-api/
        shell: bash
        run: |
          python3 -m py_compile $(git ls-files '*.py')

      # --- SMOKE TEST ---
      - name: Start FastAPI server (smoke test)
        working-directory: ./backend/log-ingestion-api/
        shell: bash
        run: |
          python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000 || exit 1
