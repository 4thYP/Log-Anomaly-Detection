# [SERVICE]
#     Flush       1
#     Daemon      Off
#     Log_Level   info
#
# # Input: Read from a.txt
# [INPUT]
#     Name        tail
#     Path        /opt/fluent-bit/bin/a.txt
#     Tag         mylogs
#
# # Output 1: Write to b.txt
# # [OUTPUT]
# #     Name   file
# #     Match  mylogs
