# #     File   b.txt
#
# # Output 2: Print to stdout
# [OUTPUT]
#     Name        stdout
#     Match       mylogs
#
[SERVICE]
    Flush       1
    Daemon      Off
    Log_Level   info

[INPUT]
    Name        tail
    Path        /home/gm005/Log-Anomaly-Detection/backend/logs/healthcare_server.log
    Tag         mylogs

[OUTPUT]
    Name        stdout
    Match       mylogs
